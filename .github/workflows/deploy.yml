name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.9
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build
      run: pnpm build
      env:
        NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./out
        
    # Upload completion and artifact API visibility can briefly disagree.
    # Deploy only after Pages can discover the artifact for this exact run.
    - name: Wait for Pages artifact availability
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for attempt in {1..12}; do
          if available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
            --jq '.artifacts | any(.name == "github-pages" and .expired == false)'); then
            if [[ "$available" == "true" ]]; then
              echo "Pages artifact is available for deployment."
              exit 0
            fi
          fi
          echo "Waiting for artifact metadata (attempt $attempt/12)."
          if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
        done
        echo "::error::The uploaded github-pages artifact is still unavailable through the Actions API."
        exit 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 